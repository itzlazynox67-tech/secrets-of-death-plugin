name: SecretsOfDeath
version: '${version}'
main: io.github.itzlazynox67.secrets.SecretsPlugin
api-version: '1.21.11'
author: itzlazynox67
description: Project foundation for the Secrets of Death and Destruction plugin.

commands:
  secrets:
    description: Main Secrets of Death plugin command.
    usage: /secrets <help|version|reload>
    aliases: [sod]

permissions:
  secrets.use:
    description: Allows use of basic Secrets of Death commands.
    default: true
  secrets.admin:
    description: Allows administration commands for Secrets of Death.
    default: op
