name: Artifacts
version: '${version}'
main: io.github.itzlazynox67.secrets.SecretsPlugin
api-version: '1.21.11'
author: itzlazynox67
description: Secrets of Death and Destruction artifacts, abilities, and collection.

commands:
  artifacts:
    description: Open the Secrets artifact menu and manage the collection.
    usage: /artifacts
    permission: secrets.op

permissions:
  secrets.op:
    description: Allows server operators to use all artifact administration commands.
    default: op
  secrets.use:
    description: Allows use of basic artifact commands.
    default: op
  secrets.admin:
    description: Allows administrative artifact actions.
    default: op
