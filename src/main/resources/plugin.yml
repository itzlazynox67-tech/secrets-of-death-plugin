name: SecretsOfDeath
version: '${version}'
main: io.github.itzlazynox67.secrets.SecretsPlugin
api-version: '1.21.11'
author: itzlazynox67
description: Secrets of Death and Destruction collectible items and book.

commands:
  secrets:
    description: Secrets of Death item and book commands.
    usage: /secrets <help|list|info|book|claim|give|giveall|coords|version|reload|protection|revoke>
    aliases: [sod]

permissions:
  secrets.use:
    description: Allows use of basic Secrets commands.
    default: true
  secrets.admin:
    description: Allows giving items and changing settings.
    default: op
